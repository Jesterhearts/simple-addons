[package]
name    = "simple-addons"
version = "0.1.0"
edition = "2024"
license = "Unlicense"

[dependencies]
clap      = { version = "4.6.7", features = ["derive", "env"] }
eframe    = { version = "0.36.2", features = ["persistence"] }
rfd       = "0.17.2"
serde     = { version = "1.0.229", features = ["derive"] }
tempfile  = "3.27.0"
thiserror = "2.0.21"
# Only to name the windowing backend eframe opens on; see src/gui/backend.rs.
# The version has to be the one eframe itself uses, or the hook will not fit.
winit     = "0.30"
zip       = "9.0.0"
